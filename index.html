  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme:dark;
      --bg:#111318;
      --panel:#191c22;
      --text:#f5f7f6;
      --muted:#9298a3;
      --green:#24d678;
      --green-dark:#062f1c;
      --blue:#23a9e8;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      overflow-x:hidden;
      background:
        radial-gradient(circle at 50% 42%,rgba(36,214,120,.055),transparent 24rem),
        var(--bg);
      color:var(--text);
      font-family:"Manrope",sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    main{
      width:min(100%,430px);
      padding:36px 24px;
      text-align:center;
      animation:enter .65s cubic-bezier(.2,.8,.2,1) both;
    }

    .avatar{
      position:relative;
      width:112px;
      height:112px;
      margin:0 auto 24px;
      padding:3px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--green),#1594d5);
      box-shadow:0 15px 42px rgba(0,0,0,.42),0 0 28px rgba(36,214,120,.1);
    }

    .avatar img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center 46%;
      border:4px solid var(--bg);
      border-radius:50%;
    }

    h1{
      margin:0;
      font-family:"Syne",sans-serif;
      font-size:24px;
      line-height:1.15;
      letter-spacing:-.035em;
      text-transform:uppercase;
    }

    .promise{
      margin:12px 0 0;
      color:#d1d5dc;
      font-size:15px;
      font-weight:700;
    }

    .free{
      margin:5px 0 0;
      color:var(--green);
      font-size:14px;
      font-weight:800;
    }

    .proof{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin:17px 0 20px;
      padding:8px 13px;
      border:1px solid rgba(255,255,255,.045);
      border-radius:999px;
      background:var(--panel);
      color:#e8eaed;
      font-size:12px;
      font-weight:700;
    }

    .proof::before{
      content:"";
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--green);
      box-shadow:0 0 10px rgba(36,214,120,.7);
    }

    .links{display:grid;gap:20px}

    .button{
      position:relative;
      isolation:isolate;
      width:80%;
      margin-inline:auto;
      min-height:55px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:11px;
      padding:0 22px;
      border-radius:24px;
      color:#fff;
      text-decoration:none;
      font-size:13px;
      font-weight:800;
      letter-spacing:.015em;
      text-transform:uppercase;
      box-shadow:0 14px 30px -17px currentColor;
      transition:transform .18s ease,filter .18s ease;
    }

    .button:hover{transform:translateY(-2px);filter:brightness(1.06)}
    .button:active{transform:translateY(0) scale(.99)}
    .button:focus-visible{outline:3px solid #fff;outline-offset:4px}
    .button svg{width:21px;height:21px;flex:none}
    .whatsapp{
      background:var(--green);
      color:var(--green-dark);
      box-shadow:0 14px 34px -14px rgba(36,214,120,.72);
      animation:pulse-scale 1.2s ease-in-out infinite;
      transform-origin:center;
    }
    .telegram{background:var(--blue);color:#fff}

    .note{
      margin:17px 0 0;
      color:var(--muted);
      font-size:11px;
      font-weight:600;
    }

    @keyframes enter{
      from{opacity:0;transform:translateY(14px)}
      to{opacity:1;transform:translateY(0)}
    }

    @keyframes pulse-scale{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.06)}
    }

    @media (max-height:590px){
      main{padding-block:22px}
      .avatar{width:88px;height:88px;margin-bottom:17px}
      .proof{margin-block:13px 16px}
    }

    @media (prefers-reduced-motion:reduce){
      main{animation:none}
      .button{transition:none;animation:none}
    }
  </style>
</head>
<body>
  <main>
    <div class="avatar">
      <!-- 336px = 3x o tamanho exibido, pra ficar nítido em tela retina.
           O PNG original tinha 2,5 MB pra mostrar 112px — no 4G, segundos de tela vazia. -->
      <img src="nexo-avatar.jpg" alt="Nexo, mascote da Nexora"
           width="112" height="112" fetchpriority="high" decoding="async">
    </div>

    <h1>Nexora Ofertas de Casa Inteligente</h1>

    <div class="proof">Conferimos o preço em cada oferta</div>

    <nav class="links" aria-label="Canais da Nexora">

        Entrar no grupo do WhatsApp
      </a>

      <a class="button telegram" href="https://t.me/nexoraachados" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.91 3.79 20.3 20.84c-.27 1.2-.98 1.49-1.99.93l-5.5-4.05-2.65 2.55c-.29.29-.54.54-1.11.54l.39-5.6 10.19-9.2c.44-.39-.1-.61-.69-.22L6.35 13.72.93 12.03c-1.18-.37-1.2-1.18.25-1.75L22.37 2.1c.98-.36 1.84.22 1.54 1.69Z"/></svg>
        Entrar no canal do Telegram
      </a>
    </nav>

    <!-- A frase anterior ("Só produtos originais e lojas confiáveis") prometia algo que
         não está sob nosso controle: quem vende é o marketplace. Um falsificado já
         escapou do filtro uma vez. Aqui só afirmamos o que a gente realmente faz. -->
    <p class="note">Comparamos os anúncios e mandamos o mais barato que encontramos 🔎</p>
  </main>
</body>
</html>
